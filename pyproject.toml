[project]
name = "rca-pipeline"
version = "0.1.0"
description = "LLM-powered classification pipeline for support transcripts, driven by an Excel taxonomy definition"
readme = "README.md"
requires-python = ">=3.11.4"
dependencies = [
    "litellm>=1.83.0",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.8.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "nest-asyncio>=1.6.0",
    "seaborn>=0.13.2",
]

[project.scripts]
rca = "rca_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rca_pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-q"
